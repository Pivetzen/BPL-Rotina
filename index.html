<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotinas Compartilhadas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📋 Rotinas Compartilhadas</h1>
            <div id="user-info-header" class="hidden flex items-center space-x-4">
                <span id="header-nome-usuario" class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full"></span>
                <button onclick="fazerLogout()" class="text-xs bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded transition">Sair</button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow my-4">

        <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
        <section id="auth-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-100">
            <div class="flex border-b mb-6">
                <button id="tab-login" onclick="alternarTabAuth('login')" class="w-1/2 pb-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Entrar</button>
                <button id="tab-cadastro" onclick="alternarTabAuth('cadastro')" class="w-1/2 pb-3 font-semibold text-slate-400 transition">Cadastrar</button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" onsubmit="tratarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="login-email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="login-senha" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">Entrar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="form-cadastro" onsubmit="tratarCadastro(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                    <input type="text" id="cad-nome" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="cad-email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="cad-senha" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">Criar Conta</button>
            </form>
            <div id="auth-mensagem" class="mt-4 text-center text-sm"></div>
        </section>

        <!-- TELA DO APLICATIVO (LOGADO) -->
        <section id="app-section" class="hidden space-y-6">

            <!-- SEÇÃO DE GESTÃO DE GRUPOS E CONVITES -->
            <div class="bg-white p-5 rounded-xl shadow-md border border-slate-100 grid md:grid-cols-2 gap-6">
                
                <!-- Grupos Ativos & Seletor -->
                <div class="space-y-4">
                    <h2 class="text-md font-semibold text-slate-700 border-b pb-2">👥 Seu Grupo Ativo</h2>
                    <div class="flex items-center space-x-2">
                        <select id="select-grupo" onchange="mudarGrupoAtivo()" class="w-full px-3 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">Carregando grupos...</option>
                        </select>
                        <button onclick="abrirModalCriarGrupo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm whitespace-nowrap transition">+ Novo</button>
                    </div>

                    <!-- Convidar Membro -->
                    <div id="painel-convite" class="pt-2 hidden">
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Convidar por E-mail</label>
                        <div class="flex space-x-2">
                            <input type="email" id="email-convidado" placeholder="email@exemplo.com" class="w-full px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <button onclick="enviarConvite()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-sm transition">Convidar</button>
                        </div>
                    </div>
                </div>

                <!-- Convites Pendentes de Outros Grupos -->
                <div class="space-y-3">
                    <h2 class="text-md font-semibold text-slate-700 border-b pb-2">📬 Convites Recebidos</h2>
                    <div id="lista-convites-pendentes" class="space-y-2 max-h-40 overflow-y-auto">
                        <p class="text-sm text-slate-400 italic">Nenhum convite pendente no momento.</p>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO DE ROTINAS DIÁRIAS -->
            <div id="painel-rotinas" class="bg-white p-5 rounded-xl shadow-md border border-slate-100 hidden space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-2">
                    <h2 class="text-lg font-bold text-slate-800">📌 Rotinas do Grupo</h2>
                    <div class="flex items-center space-x-2">
                        <label class="text-sm text-slate-600 font-medium">Data:</label>
                        <input type="date" id="filtro-data" onchange="carregarRotinas()" class="px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Adicionar Nova Rotina -->
                <form onsubmit="adicionarRotina(event)" class="flex space-x-2">
                    <input type="text" id="nova-rotina-titulo" placeholder="Ex: Dar comida para o cachorro, Trocar areia..." required class="flex-grow px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Adicionar Tarefa</button>
                </form>

                <!-- Listagem de Tarefas -->
                <div id="lista-rotinas" class="divide-y divide-slate-100 mt-4">
                    <!-- Preenchido dinamicamente via JS -->
                </div>
            </div>

        </section>
    </main>

    <!-- MODAL CRIAR GRUPO -->
    <div id="modal-grupo" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-xl shadow-lg space-y-4">
            <h3 class="text-lg font-bold text-slate-800">Criar Novo Grupo</h3>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Grupo (Ex: Família Silva)</label>
                <input type="text" id="input-nome-grupo" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="flex space-x-2 justify-end pt-2">
                <button onclick="fecharModalCriarGrupo()" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
                <button onclick="salvarNovoGrupo()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm transition">Criar</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Gerenciador de Rotinas Compartilhadas • Baseado em Supabase & GitHub Pages
    </footer>

    <!-- SCRIPT DE CONEXÃO E LÓGICA COM SUPABASE -->
    <script>
        // COLE SUA URL E CHAVE DO SUPABASE AQUI ABAIXO:
        const SUPABASE_URL = 'https://qfisuravprsqpzrsbzyt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmaXN1cmF2cHJzcXB6cnNienl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDYyODIsImV4cCI6MjEwNTU4MjI4Mn0.PjuD-p7UJYAufZgafzNV3dTFfmkRK_ba11k0GeHSGK8';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioLogado = JSON.parse(localStorage.getItem('usuario_rotinas')) || null;
        let gruposUsuario = [];
        let grupoAtivoAtual = null;

        document.addEventListener('DOMContentLoaded', () => {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('filtro-data').value = hoje;

            if (usuarioLogado) {
                entrarNoSistema();
            }
        });

        function alternarTabAuth(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-cadastro').classList.add('hidden');
                document.getElementById('tab-login').className = "w-1/2 pb-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                document.getElementById('tab-cadastro').className = "w-1/2 pb-3 font-semibold text-slate-400 transition";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-cadastro').classList.remove('hidden');
                document.getElementById('tab-cadastro').className = "w-1/2 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600 transition";
                document.getElementById('tab-login').className = "w-1/2 pb-3 font-semibold text-slate-400 transition";
            }
            document.getElementById('auth-mensagem').innerText = '';
        }

        async function tratarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            
            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .eq('email', email)
                .eq('senha', senha)
                .single();

            if (error || !data) {
                document.getElementById('auth-mensagem').innerText = "E-mail ou senha incorretos.";
                document.getElementById('auth-mensagem').className = "mt-4 text-center text-sm text-red-600";
            } else {
                usuarioLogado = { id: data.id, nome: data.nome, email: data.email };
                localStorage.setItem('usuario_rotinas', JSON.stringify(usuarioLogado));
                entrarNoSistema();
            }
        }

        async function tratarCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;

            const { data, error } = await supabaseClient
                .from('usuarios')
                .insert([{ nome, email, senha }])
                .select()
                .single();

            if (error) {
                document.getElementById('auth-mensagem').innerText = "Erro ao cadastrar (E-mail já pode estar em uso).";
                document.getElementById('auth-mensagem').className = "mt-4 text-center text-sm text-red-600";
            } else {
                usuarioLogado = { id: data.id, nome: data.nome, email: data.email };
                localStorage.setItem('usuario_rotinas', JSON.stringify(usuarioLogado));
                entrarNoSistema();
            }
        }

        function fazerLogout() {
            localStorage.removeItem('usuario_rotinas');
            usuarioLogado = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('user-info-header').classList.add('hidden');
        }

        function entrarNoSistema() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-info-header').classList.remove('hidden');
            document.getElementById('header-nome-usuario').innerText = usuarioLogado.nome;
            carregarDadosUsuario();
        }

        async function carregarDadosUsuario() {
            // Busca membros do usuário
            const { data: membros, error } = await supabaseClient
                .from('membros_grupo')
                .select('id_grupo, status_convite, papel, grupos(id, nome_grupo, dono_id)')
                .eq('id_usuario', usuarioLogado.id);

            if (error) {
                console.error("Erro ao carregar dados:", error);
                return;
            }

            gruposUsuario = [];
            let convitesPendentes = [];

            membros.forEach(m => {
                if (m.grupos) {
                    let grupoObj = {
                        id: m.grupos.id,
                        nome: m.grupos.nome_grupo,
                        dono_id: m.grupos.dono_id,
                        papel: m.papel
                    };
                    if (m.status_convite === 'Aceito') {
                        gruposUsuario.push(grupoObj);
                    } else if (m.status_convite === 'Pendente') {
                        convitesPendentes.push(grupoObj);
                    }
                }
            });

            renderizarGrupos();
            renderizarConvites(convitesPendentes);
        }

        function renderizarGrupos() {
            const select = document.getElementById('select-grupo');
            select.innerHTML = '';
            
            if (gruposUsuario.length === 0) {
                select.innerHTML = '<option value="">Nenhum grupo ativo (Crie um)</option>';
                document.getElementById('painel-rotinas').classList.add('hidden');
                document.getElementById('painel-convite').classList.add('hidden');
                return;
            }

            gruposUsuario.forEach((g) => {
                let opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.nome + (g.dono_id === usuarioLogado.id ? ' (Admin)' : '');
                select.appendChild(opt);
            });

            if (!grupoAtivoAtual || !gruposUsuario.some(g => g.id === grupoAtivoAtual.id)) {
                grupoAtivoAtual = gruposUsuario[0];
            }
            select.value = grupoAtivoAtual.id;
            
            document.getElementById('painel-rotinas').classList.remove('hidden');
            document.getElementById('painel-convite').classList.remove('hidden');
            carregarRotinas();
        }

        function mudarGrupoAtivo() {
            const idSel = document.getElementById('select-grupo').value;
            grupoAtivoAtual = gruposUsuario.find(g => g.id === idSel);
            carregarRotinas();
        }

        function renderizarConvites(convites) {
            const container = document.getElementById('lista-convites-pendentes');
            container.innerHTML = '';

            if (convites.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 italic">Nenhum convite pendente no momento.</p>';
                return;
            }

            convites.forEach(c => {
                let div = document.createElement('div');
                div.className = "flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-sm";
                div.innerHTML = `
                    <span class="font-medium text-slate-700">${c.nome}</span>
                    <div class="space-x-1">
                        <button onclick="responderConvite('${c.id}', 'Aceito')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs transition">Aceitar</button>
                        <button onclick="responderConvite('${c.id}', 'Recusado')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-xs transition">Recusar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function responderConvite(idGrupo, statusResposta) {
            const { error } = await supabaseClient
                .from('membros_grupo')
                .update({ status_convite: statusResposta })
                .eq('id_grupo', idGrupo)
                .eq('id_usuario', usuarioLogado.id);

            if (!error) {
                carregarDadosUsuario();
            } else {
                alert("Erro ao responder convite.");
            }
        }

        function abrirModalCriarGrupo() {
            document.getElementById('input-nome-grupo').value = '';
            document.getElementById('modal-grupo').classList.remove('hidden');
        }

        function fecharModalCriarGrupo() {
            document.getElementById('modal-grupo').classList.add('hidden');
        }

        async function salvarNovoGrupo() {
            const nomeGrupo = document.getElementById('input-nome-grupo').value;
            if (!nomeGrupo) return;

            // 1. Cria o grupo
            const { data: grupoData, error: grupoError } = await supabaseClient
                .from('grupos')
                .insert([{ nome_grupo: nomeGrupo, dono_id: usuarioLogado.id }])
                .select()
                .single();

            if (grupoError) {
                alert("Erro ao criar grupo.");
                return;
            }

            // 2. Adiciona o criador como Membro Admin aceito
            await supabaseClient
                .from('membros_grupo')
                .insert([{ id_grupo: grupoData.id, id_usuario: usuarioLogado.id, status_convite: 'Aceito', papel: 'Admin' }]);

            fecharModalCriarGrupo();
            carregarDadosUsuario();
        }

        async function enviarConvite() {
            const emailConvidado = document.getElementById('email-convidado').value;
            if (!emailConvidado || !grupoAtivoAtual) return;

            // Procura o usuário pelo email
            const { data: userConvidado, error: userError } = await supabaseClient
                .from('usuarios')
                .select('id')
                .eq('email', emailConvidado)
                .single();

            if (userError || !userConvidado) {
                alert("Usuário com este e-mail não encontrado no sistema.");
                return;
            }

            // Insere o convite
            const { error } = await supabaseClient
                .from('membros_grupo')
                .insert([{ id_grupo: grupoAtivoAtual.id, id_usuario: userConvidado.id, status_convite: 'Pendente', papel: 'Membro' }]);

            if (!error) {
                alert("Convite enviado com sucesso!");
                document.getElementById('email-convidado').value = '';
            } else {
                alert("Este usuário já foi convidado ou já faz parte do grupo.");
            }
        }

        async function carregarRotinas() {
            if (!grupoAtivoAtual) return;
            const dataStr = document.getElementById('filtro-data').value;

            const { data: rotinas, error } = await supabaseClient
                .from('rotinas_log')
                .select('*, usuarios(nome)')
                .eq('id_grupo', grupoAtivoAtual.id)
                .eq('data', dataStr);

            if (!error) {
                renderizarRotinas(rotinas);
            }
        }

        function renderizarRotinas(rotinas) {
            const container = document.getElementById('lista-rotinas');
            container.innerHTML = '';

            if (rotinas.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 italic text-center py-4">Nenhuma rotina cadastrada para esta data.</p>';
                return;
            }

            rotinas.forEach(r => {
                let concluida = r.status === "Concluido";
                let nomeResponsavel = r.usuarios ? r.usuarios.nome : "Desconhecido";
                let div = document.createElement('div');
                div.className = "py-3 flex items-center justify-between";
                
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" ${concluida ? 'checked' : ''} onchange="alternarStatusRotina('${r.id}', this.checked)" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <p class="text-sm font-medium ${concluida ? 'line-through text-slate-400' : 'text-slate-800'}">${r.titulo_tarefa}</p>
                            ${concluida ? `<p class="text-xs text-emerald-600 font-medium">Feito por ${nomeResponsavel} às ${r.horario_conclusao}</p>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function adicionarRotina(e) {
            e.preventDefault();
            const titulo = document.getElementById('nova-rotina-titulo').value;
            const dataStr = document.getElementById('filtro-data').value;
            if (!titulo || !grupoAtivoAtual) return;

            const { error } = await supabaseClient
                .from('rotinas_log')
                .insert([{
                    id_grupo: grupoAtivoAtual.id,
                    titulo_tarefa: titulo,
                    data: dataStr,
                    status: 'Pendente'
                }]);

            if (!error) {
                document.getElementById('nova-rotina-titulo').value = '';
                carregarRotinas();
            } else {
                alert("Erro ao adicionar tarefa.");
            }
        }

        async function alternarStatusRotina(idTarefa, isChecked) {
            const status = isChecked ? "Concluido" : "Pendente";
            const horario = isChecked ? new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
            
            const { error } = await supabaseClient
                .from('rotinas_log')
                .update({
                    status: status,
                    feito_por_id: isChecked ? usuarioLogado.id : null,
                    horario_conclusao: horario
                })
                .eq('id', idTarefa);

            if (!error) {
                carregarRotinas();
            } else {
                alert("Erro ao atualizar status da tarefa.");
            }
        }
    </script>
</body>
</html>
